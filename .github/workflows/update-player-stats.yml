name: Spelerstatistieken aanpassen

on:
  workflow_dispatch:
    inputs:
      player_id:
        description: Speler
        required: true
        type: choice
        options:
          - 'Rune Paque | rune-paque'
          - 'Arjen Coenegracht | arjen-coenegracht'
          - 'Milan Schroyen | milan-schroyen'
          - 'Yoran Knaepen | yoran-knaepen'
          - 'Rens Vanekan | rens-vanekan'
          - 'Pedro Santos | pedro-santos'
          - 'Math Royer | math-royer'
          - 'Devin Thirion | devin-thirion'
          - 'Bipin Naeten | bipin-naeten'
          - 'Robbe Grosemans | robbe-grosemans'
          - 'Nicolas Libert | nicolas-libert'
      goals:
        description: Totaal aantal goals
        required: true
        default: '0'
        type: string
      assists:
        description: Totaal aantal assists
        required: true
        default: '0'
        type: string
      yellow_cards:
        description: Totaal aantal gele kaarten
        required: true
        default: '0'
        type: string
      red_cards:
        description: Totaal aantal rode kaarten
        required: true
        default: '0'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Spelerstatistieken aanpassen
        env:
          PLAYER_ID: ${{ inputs.player_id }}
          GOALS: ${{ inputs.goals }}
          ASSISTS: ${{ inputs.assists }}
          YELLOW_CARDS: ${{ inputs.yellow_cards }}
          RED_CARDS: ${{ inputs.red_cards }}
        run: npm run update-player-stats

      - name: Wijziging opslaan
        env:
          PLAYER_ID: ${{ inputs.player_id }}
        run: |
          if git diff --quiet -- public/data/player-stats-2026-2027.json; then
            echo "De statistieken waren al hetzelfde."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/player-stats-2026-2027.json
            git commit -m "Update spelerstatistieken $PLAYER_ID"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Klassement bijwerken
        run: npm run update-ranking

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
